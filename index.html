<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Yun Ho, Portfolio</title>
<link rel="icon" href="tofu-sprite.ico">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <!-- ── STAGE ── -->
  <div class="stage">

    <!-- LEFT BUBBLES -->
    <div class="bubble-col bubble-col-left">
      <div class="bubble" style="--d:2.4s;--delay:0s"   onclick="bubblePick('story')"     id="b-story">
        <span class="bubble-label">* Scott's Story</span>
      </div>
      <div class="bubble" style="--d:2.0s;--delay:0.5s" onclick="bubblePick('skills')"    id="b-skills">
        <span class="bubble-label">! Skills </span>
      </div>
      <div class="bubble" style="--d:2.7s;--delay:0.9s" onclick="bubblePick('funfact')"   id="b-funfact">
        <span class="bubble-label">? Fun Facts</span>
      </div>
    </div>

    <!-- TOFU -->
    <div class="tofu-wrap" id="tofu" onclick="petTofu()" title="Pet Tofu!">
      <div class="tofu-emote" id="emote">!</div>

      <!--
        Sprite replacement
      -->
      <img class="tofu-image" src="tofu-sprite.png" alt="sprite" style="image-rendering:pixelated; mix-blend-mode:multiply;"/>

    </div>

    <!-- RIGHT BUBBLES -->
    <div class="bubble-col bubble-col-right">
      <div class="bubble" style="--d:2.2s;--delay:0.3s" onclick="bubblePick('projects')"   id="b-projects">
        <span class="bubble-label">* Scott's Work</span>
      </div>
      <div class="bubble" style="--d:2.5s;--delay:0.7s" onclick="bubblePick('contact')"    id="b-contact">
        <span class="bubble-label">! Contact Scott</span>
      </div>
      <div class="bubble" style="--d:1.9s;--delay:1.1s" onclick="bubblePick('about_tofu')" id="b-about_tofu">
        <span class="bubble-label">? About Tofu</span>
      </div>
    </div>

  </div><!-- /stage -->

  <!-- ── DIALOGUE BOX ── -->
  <div class="dialogue-section">
    <div class="dialogue-box" id="dialogueBox">
      <div class="speaker-tag">TOFU — SECRETARY</div>
      <div class="dialogue-text" id="dialogueText">
        Ah, a visitor! Welcome to my employer's portfolio. I'm Tofu, their personal secretary.<span class="cursor"></span>
      </div>
      <div class="advance-arrow" id="advanceArrow" onclick="handleAdvanceInput()">▼</div>
    </div>
    <div class="content-panel" id="contentPanel"></div>
  </div>

</div><!-- /wrapper -->

<script src="script.js"></script>
</body>
</html>
